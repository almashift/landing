<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>Page not found | AlmaShift</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #ffffff; --text: #0f172a; --muted: #475569; --brand: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1120; --text: #f1f5f9; --muted: #94a3b8; --brand: #818cf8; } }
    :root[data-theme="dark"] { --bg: #0b1120; --text: #f1f5f9; --muted: #94a3b8; --brand: #818cf8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    h1 { font-size: 2rem; margin: 16px 0 8px; }
    p { color: var(--muted); }
    a { color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" width="56" height="56" alt="">
    <h1>This page took a different shift.</h1>
    <p>We couldn't find what you were looking for.</p>
    <p><a href="/">Back to AlmaShift</a> &nbsp;·&nbsp; <a href="https://learn.almashift.com/lms">Browse courses</a></p>
  </main>
</body>
</html>
