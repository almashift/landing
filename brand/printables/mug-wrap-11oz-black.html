<!doctype html>
<!-- 11 oz mug wrap for a black mug, 8.5 x 3.5 in (2550x1050 px at 300 DPI), transparent background.
     The logo is printed twice, centred on each half, so it faces out for left- and right-handed drinkers.
     Render: chrome --headless=new --screenshot --window-size=816,336 --force-device-scale-factor=3.125 --default-background-color=00000000
             chrome --headless=new --no-pdf-header-footer --print-to-pdf -->
<html><head><meta charset="utf-8">
<style>
  @page { size: 8.5in 3.5in; margin: 0; }
  html, body { margin: 0; width: 8.5in; height: 3.5in; overflow: hidden; background: transparent; }
  body { display: grid; grid-template-columns: 1fr 1fr; }
  .side { display: flex; align-items: center; justify-content: center; }
  .side img, .side svg { width: 3in; height: auto; display: block; }
</style></head>
<body>
  <div class="side"><img src="almashift-horizontal-color-on-dark.svg" alt="AlmaShift"></div>
  <div class="side"><img src="almashift-horizontal-color-on-dark.svg" alt="AlmaShift"></div>
</body></html>
